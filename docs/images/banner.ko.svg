<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="제품 생애주기 통합관리 플랫폼 — 접수부터 종결까지, 같은 절차를 같은 순서로">
