  <text x="80" y="160" fill="#8da9c4" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="22">설계변경 · 신규 개발 · 결재 · 문서 · AI — 누가 맡아도 같은 절차를 같은 순서로</text>
