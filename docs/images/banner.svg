<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Product Lifecycle Workflow Platform — same procedure, same order, from intake to closure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#13315c"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <g fill="none" stroke="#8da9c4" stroke-opacity="0.18">
    <path d="M0 260 H1280"/><path d="M0 60 H1280"/>
  </g>
  <text x="80" y="118" fill="#eef4ed" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="46" font-weight="700">Product Lifecycle Workflow Platform</text>
  <text x="80" y="160" fill="#8da9c4" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="20">Engineering change · new development · approvals · documents · AI — same procedure, same order, whoever handles it</text>
  <g font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="17" text-anchor="middle">
    <g transform="translate(80 205)">
      <rect width="150" height="40" rx="20" fill="#134074"/><text x="75" y="26" fill="#eef4ed">Intake</text>
      <rect x="180" width="150" height="40" rx="20" fill="#134074"/><text x="255" y="26" fill="#eef4ed">Review</text>
      <rect x="360" width="150" height="40" rx="20" fill="#134074"/><text x="435" y="26" fill="#eef4ed">Revise docs</text>
      <rect x="540" width="150" height="40" rx="20" fill="#f4a259"/><text x="615" y="26" fill="#0b2545" font-weight="700">Approval</text>
      <rect x="720" width="150" height="40" rx="20" fill="#134074"/><text x="795" y="26" fill="#eef4ed">Apply</text>
      <rect x="900" width="150" height="40" rx="20" fill="#f4a259"/><text x="975" y="26" fill="#0b2545" font-weight="700">Close</text>
      <g stroke="#8da9c4" stroke-width="2">
        <path d="M152 20 H178"/><path d="M332 20 H358"/><path d="M512 20 H538"/><path d="M692 20 H718"/><path d="M872 20 H898"/>
      </g>
    </g>
  </g>
</svg>
